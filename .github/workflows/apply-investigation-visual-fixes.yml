name: Apply Investigation Canvas visual fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-investigation-visual-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-investigation-canvas-visuals
          fetch-depth: 0

      - name: Apply patch
        run: |
          python recovery/apply-visual-fixes.py
          git diff --check
          git diff --stat

      - name: Run tests
        working-directory: investigation-canvas
        run: npm test

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add investigation-canvas/src/app.js investigation-canvas/src/workspace.js investigation-canvas/styles.css recovery/webmcp-kit-browser-verify.py
          git commit -m "fix: repair Investigation Canvas visual layouts"
          git push origin HEAD:fix-investigation-canvas-visuals
