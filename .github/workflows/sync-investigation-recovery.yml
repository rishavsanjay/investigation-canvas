name: Sync Investigation Canvas recovery branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-investigation-recovery.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover-original-investigation-canvas
          fetch-depth: 0

      - name: Merge current main while preserving recovered app on conflicts
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main

          set +e
          git merge --no-edit -X ours origin/main
          code=$?
          set -e

          if [ "$code" -ne 0 ]; then
            echo "Automatic merge reported conflicts; resolving investigation-canvas paths in favor of recovered branch."
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                investigation-canvas/*)
                  if git cat-file -e "HEAD:$path" 2>/dev/null; then
                    git checkout --ours -- "$path"
                    git add -- "$path"
                  else
                    git rm -f --ignore-unmatch -- "$path"
                  fi
                  ;;
                *)
                  echo "Unexpected non-app conflict: $path" >&2
                  exit 1
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U)
            test -z "$(git diff --name-only --diff-filter=U)"
            git commit --no-edit
          fi

          git push origin HEAD:recover-original-investigation-canvas
