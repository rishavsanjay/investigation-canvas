name: Investigation Canvas PR CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'investigation-canvas/**'
      - 'recovery/webmcp-kit-browser-verify.py'
      - 'recovery/apply-post-zip-enhancements.py'
      - '.github/workflows/investigation-canvas-pr-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Static and unit verification
        run: |
          set -euo pipefail
          git diff --check origin/${{ github.base_ref }}...HEAD
          cd investigation-canvas
          npm test

      - name: Install Chromium and Playwright
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright==1.62.1
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          test -n "$CHROMIUM_PATH"
          test -x "$CHROMIUM_PATH"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"

      - name: Boot app
        run: |
          set -euo pipefail
          cd investigation-canvas
          python3 -m http.server 4173 >/tmp/investigation-canvas-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/investigation-canvas-server.log
          exit 1

      - name: Original browser E2E
        env:
          CHROMIUM_PATH: ${{ env.CHROMIUM_PATH }}
          ARTIFACTS_DIR: /tmp/investigation-canvas-assets
        run: python investigation-canvas/tests/e2e.py

      - name: Automatic demo E2E
        env:
          CHROMIUM_PATH: ${{ env.CHROMIUM_PATH }}
          ARTIFACTS_DIR: /tmp/investigation-canvas-assets
        run: python investigation-canvas/tests/demo_e2e.py

      - name: WebMCP Kit browser verification
        env:
          CHROMIUM_PATH: ${{ env.CHROMIUM_PATH }}
          WEBMCP_REPORT_PATH: /tmp/webmcp-kit-verification.json
        run: python recovery/webmcp-kit-browser-verify.py

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: investigation-canvas-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            /tmp/webmcp-kit-verification.json
            /tmp/investigation-canvas-assets/e2e-desktop.png
            /tmp/investigation-canvas-assets/e2e-mobile.png
            /tmp/investigation-canvas-assets/demo-complete.png
            /tmp/investigation-canvas-server.log
          if-no-files-found: warn
          retention-days: 30
