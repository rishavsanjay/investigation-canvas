name: Investigation Canvas PR CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'investigation-canvas/**'
      - 'recovery/webmcp-kit-browser-verify.py'
      - 'recovery/apply-post-zip-enhancements.py'
      - '.github/workflows/investigation-canvas-pr-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static and unit verification
        run: |
          set -euo pipefail
          git diff --check origin/${{ github.base_ref }}...HEAD
          cd investigation-canvas
          npm test

      - name: Install Chromium and Playwright
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
          sudo mkdir -p /mnt/data/investigation-canvas/assets
          sudo chown -R "$USER":"$USER" /mnt/data

      - name: Boot app
        run: |
          set -euo pipefail
          cd investigation-canvas
          python3 -m http.server 4173 >/tmp/investigation-canvas-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/investigation-canvas-server.log
          exit 1

      - name: Original browser E2E
        env:
          CHROMIUM_PATH: ${{ env.CHROMIUM_PATH }}
        run: python investigation-canvas/tests/e2e.py

      - name: WebMCP Kit browser verification
        env:
          CHROMIUM_PATH: ${{ env.CHROMIUM_PATH }}
          WEBMCP_REPORT_PATH: /tmp/webmcp-kit-verification.json
        run: python recovery/webmcp-kit-browser-verify.py

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investigation-canvas-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            /tmp/webmcp-kit-verification.json
            /mnt/data/investigation-canvas/assets/e2e-desktop.png
            /mnt/data/investigation-canvas/assets/e2e-mobile.png
            /tmp/investigation-canvas-server.log
          if-no-files-found: warn
          retention-days: 30
