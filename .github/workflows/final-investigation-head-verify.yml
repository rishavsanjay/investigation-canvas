name: Final Investigation Canvas head verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-investigation-head-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 84bfbb21df2ac416cf8f7edecd9cd92021490837
          fetch-depth: 0

      - name: Unit and contract tests
        working-directory: investigation-canvas
        run: npm test

      - name: Install browser verifier
        run: |
          set -euo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
          sudo mkdir -p /mnt/data/investigation-canvas/assets
          sudo chown -R "$USER":"$USER" /mnt/data

      - name: Boot app
        run: |
          cd investigation-canvas
          python3 -m http.server 4173 >/tmp/investigation-canvas-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Original browser E2E
        run: python investigation-canvas/tests/e2e.py

      - name: WebMCP Kit verification
        env:
          WEBMCP_REPORT_PATH: /tmp/webmcp-kit-verification.json
        run: python recovery/webmcp-kit-browser-verify.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-investigation-head-${{ github.run_id }}
          path: |
            /tmp/webmcp-kit-verification.json
            /mnt/data/investigation-canvas/assets/e2e-desktop.png
            /mnt/data/investigation-canvas/assets/e2e-mobile.png
          if-no-files-found: warn
          retention-days: 30
