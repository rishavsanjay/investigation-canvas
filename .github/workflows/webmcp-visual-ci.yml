name: webmcp-visual-ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  browser-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install browser harness
        working-directory: ci/visual
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: ci/visual
        run: npx playwright install --with-deps chromium
      - name: Run harness self-test
        working-directory: ci/visual
        run: node visual-selftest.mjs
      - name: Upload harness screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: visual-harness-${{ github.run_id }}
          path: ci/visual/artifacts
          if-no-files-found: error
          retention-days: 7

  native-webmcp-chrome152:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install harness and Chrome dependencies
        working-directory: ci/visual
        run: |
          npm ci
          npx playwright install-deps chromium
      - name: Download Chrome for Testing 152
        run: |
          curl -fL --retry 3 -o /tmp/chrome.zip https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.75/linux64/chrome-linux64.zip
          echo "a16d36890636bd72251133b27f05825f7f9269c2425b3408fa3a76e10dccd8f1  /tmp/chrome.zip" | sha256sum -c -
          unzip -q /tmp/chrome.zip -d /tmp/chrome-cft
          /tmp/chrome-cft/chrome-linux64/chrome --version
      - name: Serve native WebMCP probe fixture
        run: |
          python3 -m http.server 4174 --directory ci/visual/native-fixture > /tmp/native-webmcp-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4174/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/ >/dev/null
      - name: Probe native document.modelContext and registerTool
        working-directory: ci/visual
        env:
          CHROME_PATH: /tmp/chrome-cft/chrome-linux64/chrome
          NATIVE_PROBE_URL: http://127.0.0.1:4174/
        run: node native-webmcp.mjs
      - name: Upload native WebMCP screenshots and report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-webmcp-chrome152-${{ github.run_id }}
          path: ci/visual/artifacts/native-webmcp
          if-no-files-found: error
          retention-days: 7

  investigation-canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Detect Investigation Canvas source
        id: app
        run: |
          if [ -f investigation-canvas/index.html ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No investigation-canvas/ checkout yet; app-specific visual job will be skipped."
          fi
      - uses: actions/setup-node@v7.0.0
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
      - name: Run source contract tests
        if: steps.app.outputs.present == 'true'
        working-directory: investigation-canvas
        run: npm test
      - name: Install browser harness
        if: steps.app.outputs.present == 'true'
        working-directory: ci/visual
        run: npm ci
      - name: Install Playwright Chromium
        if: steps.app.outputs.present == 'true'
        working-directory: ci/visual
        run: npx playwright install --with-deps chromium
      - name: Serve Investigation Canvas
        if: steps.app.outputs.present == 'true'
        run: |
          python3 -m http.server 4173 --directory investigation-canvas > /tmp/investigation-canvas-http.log 2>&1 &
          echo $! > /tmp/investigation-canvas-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Run multi-state visual/browser automation
        if: steps.app.outputs.present == 'true'
        working-directory: ci/visual
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node investigation-visual.mjs
      - name: Upload Investigation Canvas screenshots and diagnostics
        if: always() && steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: investigation-canvas-visual-${{ github.run_id }}
          path: ci/visual/artifacts
          if-no-files-found: error
          retention-days: 14
