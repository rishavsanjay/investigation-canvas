name: Apply Investigation Canvas enhancements

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-investigation-canvas-enhancements.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out recovered baseline branch
        uses: actions/checkout@v4
        with:
          ref: recover-original-investigation-canvas
          fetch-depth: 0

      - name: Apply the reviewed post-ZIP enhancement patch
        run: |
          set -euo pipefail
          python recovery/apply-post-zip-enhancements.py
          git diff --check

      - name: Run full Node test suite
        working-directory: investigation-canvas
        run: npm test

      - name: Install browser verifier
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
          sudo mkdir -p /mnt/data/investigation-canvas/assets
          sudo chown -R "$USER":"$USER" /mnt/data

      - name: Boot the recovered app
        run: |
          set -euo pipefail
          cd investigation-canvas
          python3 -m http.server 4173 >/tmp/investigation-canvas-server.log 2>&1 &
          echo $! >/tmp/investigation-canvas-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/investigation-canvas-server.log
          exit 1

      - name: Run original browser E2E
        env:
          CHROMIUM_PATH: ${{ env.CHROMIUM_PATH }}
        run: python investigation-canvas/tests/e2e.py

      - name: Run WebMCP Kit verification ladder
        env:
          CHROMIUM_PATH: ${{ env.CHROMIUM_PATH }}
          WEBMCP_REPORT_PATH: /tmp/webmcp-kit-verification.json
        run: python recovery/webmcp-kit-browser-verify.py

      - name: Preserve verification report and screenshots
        if: success()
        run: |
          set -euo pipefail
          cp /tmp/webmcp-kit-verification.json recovery/webmcp-kit-verification.json
          mkdir -p recovery/browser-evidence
          cp /mnt/data/investigation-canvas/assets/e2e-desktop.png recovery/browser-evidence/e2e-desktop.png
          cp /mnt/data/investigation-canvas/assets/e2e-mobile.png recovery/browser-evidence/e2e-mobile.png

      - name: Commit verified enhanced source to recovery branch
        if: success()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A investigation-canvas recovery/webmcp-kit-verification.json recovery/browser-evidence
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "feat: reapply verified Investigation Canvas enhancements"
            git push origin HEAD:recover-original-investigation-canvas
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investigation-canvas-webmcp-verification-${{ github.run_id }}
          path: |
            /tmp/webmcp-kit-verification.json
            /mnt/data/investigation-canvas/assets/e2e-desktop.png
            /mnt/data/investigation-canvas/assets/e2e-mobile.png
            /tmp/investigation-canvas-server.log
          if-no-files-found: warn
          retention-days: 30
